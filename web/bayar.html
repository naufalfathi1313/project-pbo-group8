<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayar Tagihan · Workspace & PC Gaming</title>
<meta name="description" content="Halaman bayar yang terbuka setelah pelanggan scan QR di layar kasir.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0D1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D1F;
    --bg-2: #141833;
    --line: #262B52;
    --text: #E6E8F2;
    --muted: #8A8FB0;
    --accent: #7C4DFF;
    --ok: #4ADE80;
    --no: #FF8A8E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 32px;
  }
  main { width: 100%; max-width: 420px; }
  .brand { font-family: "Space Grotesk", Inter, sans-serif; font-weight: 700; margin: 0 0 20px; }
  .brand span { color: var(--accent); }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; }
  .label { color: var(--muted); font-size: .9rem; margin: 0; }
  .total { font-family: "Space Grotesk", Inter, sans-serif; font-size: 2.5rem; font-weight: 700; line-height: 1.1; margin: 4px 0 20px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; padding-top: 16px; border-top: 1px solid var(--line); }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; }
  .tanya { font-weight: 600; margin: 24px 0 12px; }
  .aksi { display: grid; gap: 10px; }
  button {
    font: inherit; font-weight: 600; padding: 15px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  button.utama { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--no); font-size: .9rem; margin: 12px 0 0; }
  .error:empty { display: none; }
  .hasil { text-align: center; }
  .ikon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 4px auto 14px; font-size: 2rem; font-weight: 700; }
  .ok .ikon { background: rgba(74, 222, 128, .14); color: var(--ok); }
  .batal .ikon { background: rgba(255, 138, 142, .14); color: var(--no); }
  .hasil h1 { font-family: "Space Grotesk", Inter, sans-serif; font-size: 1.5rem; margin: 0 0 6px; }
  .hasil button { width: 100%; margin-top: 20px; }
  .catatan { color: var(--muted); font-size: .8rem; text-align: center; margin: 20px 0 0; }
</style>
</head>
<body>
<main>
  <p class="brand">WORKSPACE <span>&amp; PC GAMING</span></p>

  <section id="tagihan" class="card" hidden>
    <p class="label">Total tagihan</p>
    <p class="total" id="total">Rp0</p>
    <dl>
      <dt>Fasilitas</dt><dd id="fasilitas"></dd>
      <dt>Pelanggan</dt><dd id="pelanggan"></dd>
      <dt>Durasi</dt><dd id="durasi"></dd>
      <dt>Kode bayar</dt><dd id="kode"></dd>
    </dl>
    <p class="tanya">Bayar tagihan ini sekarang?</p>
    <div class="aksi">
      <button class="utama" id="btnYa"><span aria-hidden="true">✓</span> Ya, bayar sekarang</button>
      <button id="btnTidak"><span aria-hidden="true">✕</span> Tidak</button>
    </div>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section id="hasil" class="card hasil" hidden>
    <div class="ikon" id="ikon" aria-hidden="true"></div>
    <h1 id="judulHasil"></h1>
    <p class="label" id="teksHasil"></p>
    <button id="btnKembali" hidden>Kembali ke tagihan</button>
  </section>

  <section id="salah" class="card hasil" hidden>
    <h1>Link tidak valid</h1>
    <p class="label">Scan ulang QR yang tampil di layar kasir.</p>
  </section>

  <p class="catatan">Simulasi pembayaran untuk tugas UAS PBO. Tidak ada uang yang ditarik.</p>
</main>

<script>
  // Perantara pesan yang juga ditanyai aplikasi Java setiap 3 detik (lihat PembayaranQr.java)
  const PERANTARA = 'https://ntfy.sh';

  const $ = (id) => document.getElementById(id);
  const data = new URLSearchParams(location.search);
  const kode = data.get('id') || '';

  // Kode dibuat aplikasi: "wsrent-" + 32 huruf/angka acak. Selain itu berarti link-nya rusak.
  if (/^wsrent-[0-9a-f]{32}$/.test(kode)) {
    $('total').textContent = 'Rp' + Number(data.get('t') || 0).toLocaleString('id-ID');
    $('fasilitas').textContent = data.get('f') || '-';
    $('pelanggan').textContent = data.get('n') || '-';
    $('durasi').textContent = data.get('d') || '-';
    $('kode').textContent = kode.slice(-6).toUpperCase();
    $('tagihan').hidden = false;
  } else {
    $('salah').hidden = false;
  }

  // Kirim jawaban pelanggan ("LUNAS" atau "BATAL") ke perantara, dengan topik = kode tagihan
  async function kirim(jawaban) {
    $('btnYa').disabled = $('btnTidak').disabled = true;
    $('error').textContent = '';
    try {
      const res = await fetch(PERANTARA + '/' + kode, { method: 'POST', body: jawaban });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      tampilkanHasil(jawaban === 'LUNAS');
    } catch (e) {
      $('error').textContent = 'Gagal mengirim. Cek koneksi internet, lalu coba lagi.';
    } finally {
      $('btnYa').disabled = $('btnTidak').disabled = false;
    }
  }

  function tampilkanHasil(lunas) {
    $('tagihan').hidden = true;
    $('hasil').hidden = false;
    $('hasil').className = 'card hasil ' + (lunas ? 'ok' : 'batal');
    $('ikon').textContent = lunas ? '✓' : '✕';
    $('judulHasil').textContent = lunas ? 'Pembayaran berhasil' : 'Pembayaran dibatalkan';
    $('teksHasil').textContent = lunas
      ? 'Terima kasih! Layar kasir akan ter-update dalam beberapa detik.'
      : 'Tagihan belum dibayar. Kalau berubah pikiran, tekan tombol di bawah.';
    $('btnKembali').hidden = lunas;
  }

  $('btnYa').onclick = () => kirim('LUNAS');
  $('btnTidak').onclick = () => kirim('BATAL');
  $('btnKembali').onclick = () => {
    $('hasil').hidden = true;
    $('tagihan').hidden = false;
  };
</script>
</body>
</html>
